name: Android release

# push 到 main 就用正式金鑰編 release APK，放到固定的 Release「android-latest」，網址不變、直接下載安裝。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: flutter build apk --release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get

      # 從 Secrets 還原簽名金鑰；每次簽名一致，手機才能直接覆蓋升級、資料不掉。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret，請先執行 upload-secrets.sh"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOP
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOP

      - run: flutter build apk --release

      - name: Rename apk
        run: cp build/app/outputs/flutter-apk/app-release.apk build/body_lab.apk

      - uses: actions/upload-artifact@v4
        with:
          name: body_lab-apk
          path: body_lab/build/body_lab.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release (android-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest
          git push -f origin android-latest
          NOTES="Android 安裝檔，來自 commit ${GITHUB_SHA::7}（$(date -u +'%Y-%m-%d %H:%M UTC')）。

          手機瀏覽器直接下載 body_lab.apk 開啟安裝；第一次要允許「安裝未知來源 App」。簽名固定，之後可直接覆蓋安裝升級。"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title "Android 最新版（APK）" --notes "$NOTES"
          else
            gh release create android-latest --title "Android 最新版（APK）" --notes "$NOTES" --latest=false
          fi
          gh release upload android-latest build/body_lab.apk --clobber
