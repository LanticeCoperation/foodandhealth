name: iOS build

# public repo 使用標準 GitHub-hosted runner 免費，每次 push / PR 都編一次 iOS。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter build ios --no-codesign
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get

      # 不簽名，只確認 iOS 端（HealthKit 外掛、Info.plist、entitlements、部署目標）能編譯。
      - run: flutter build ios --no-codesign --debug
