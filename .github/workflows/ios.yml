name: iOS build

# public repo 使用標準 GitHub-hosted runner 免費，每次 push / PR 都編一次 iOS。
# 產出未簽名的 .ipa（Actions 頁面的 artifact），在 Windows 用 Sideloadly 以自己的 Apple ID 重新簽名後裝進 iPhone。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: flutter build ios --release --no-codesign
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get

      # 不簽名：Sideloadly 安裝時會用使用者自己的 Apple ID 重簽，HealthKit entitlements 會一併保留。
      - run: flutter build ios --release --no-codesign

      # 把 Runner.app 包成標準 .ipa 結構（Payload/Runner.app）。
      - name: Package unsigned ipa
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qry "body_lab-unsigned.ipa" Payload
          ls -lh body_lab-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: body_lab-unsigned-ipa
          path: body_lab/ipa/body_lab-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # push 到 main 時同步放到固定的 Release「ios-latest」，網址不變、不用登入也能下載。
      - name: Publish to GitHub Release (ios-latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f ios-latest
          git push -f origin ios-latest
          NOTES="未簽名的 iOS 安裝檔，來自 commit ${GITHUB_SHA::7}（$(date -u +'%Y-%m-%d %H:%M UTC')）。

          Windows 用 Sideloadly 以自己的 Apple ID 重新簽名後裝進 iPhone；免費 Apple ID 7 天到期後重裝一次即可。"
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release edit ios-latest --title "iOS 最新版（未簽名 .ipa）" --notes "$NOTES"
          else
            gh release create ios-latest --title "iOS 最新版（未簽名 .ipa）" --notes "$NOTES" --latest=false
          fi
          gh release upload ios-latest ipa/body_lab-unsigned.ipa --clobber
