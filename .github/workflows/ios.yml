name: iOS build

# public repo 使用標準 GitHub-hosted runner 免費，每次 push / PR 都編一次 iOS。
# 產出未簽名的 .ipa（Actions 頁面的 artifact），在 Windows 用 Sideloadly 以自己的 Apple ID 重新簽名後裝進 iPhone。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter build ios --release --no-codesign
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get

      # 不簽名：Sideloadly 安裝時會用使用者自己的 Apple ID 重簽，HealthKit entitlements 會一併保留。
      - run: flutter build ios --release --no-codesign

      # 把 Runner.app 包成標準 .ipa 結構（Payload/Runner.app）。
      - name: Package unsigned ipa
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qry "body_lab-unsigned.ipa" Payload
          ls -lh body_lab-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: body_lab-unsigned-ipa
          path: body_lab/ipa/body_lab-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
