name: Release builds

# push 到 main：iOS（未簽名 .ipa）與 Android（正式簽名 APK）平行編譯，
# 兩邊都成功後一起放到固定的 Release「latest」，網址不變、直接下載。
on:
  # 刻意只留手動觸發。
  #
  # 這個 workflow 一跑就會更新固定的 Release「latest」，而 build number 是
  # CI run number——純後端或文件的改動也會讓家人手機跳出「有新版」，
  # 但 App 內容一個字都沒變。要發版時自己到 Actions 按 Run workflow。
  #
  # 編譯有沒有壞由 ci.yml 顧（它有一個只編不發的 iOS job），不需要靠這個。
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  ios:
    name: iOS (.ipa, no codesign)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # 不簽名：Sideloadly 安裝時會用使用者自己的 Apple ID 重簽，HealthKit entitlements 會一併保留。
      # build number 用 workflow run number，每次發佈自動 +1；版本名稱沿用 pubspec.yaml
      # 同步伺服器的位址與金鑰。沒設這兩個 secret 時 --dart-define 帶空字串，
      # SyncConfig.configured 是 false，發出去的版本同步功能整個關閉。
      # NAS 架好 HTTPS 之後在 repo 的 Settings → Secrets 加上
      # SUPABASE_URL（https://…，iOS 的 ATS 擋明文）與 SUPABASE_KEY（publishable key）。
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
      - name: Package unsigned ipa
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qry body_lab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: body_lab/ipa/body_lab-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android (.apk, release key)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # 從 Secrets 還原簽名金鑰；每次簽名一致，手機才能直接覆蓋升級、資料不掉。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret，請先執行 upload-secrets.ps1"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOP
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOP
      # build number（versionCode）用 workflow run number，只增不減；App 用它判斷有沒有新版
      # 同步伺服器的位址與金鑰。沒設這兩個 secret 時 --dart-define 帶空字串，
      # SyncConfig.configured 是 false，發出去的版本同步功能整個關閉。
      # NAS 架好 HTTPS 之後在 repo 的 Settings → Secrets 加上
      # SUPABASE_URL（https://…，iOS 的 ATS 擋明文）與 SUPABASE_KEY（publishable key）。
      - run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/body_lab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: body_lab/build/body_lab.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to Release "latest"
    needs: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          VERSION=$(grep -E '^version:' body_lab/pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          BUILD=${{ github.run_number }}
          REPO_URL="https://github.com/${{ github.repository }}"
          # App 啟動時讀這個檔比對 build number；APK 先上傳完才更新它
          cat > dist/version.json <<EOJ
          {
            "version": "$VERSION",
            "build": $BUILD,
            "commit": "${GITHUB_SHA::7}",
            "apkUrl": "$REPO_URL/releases/download/latest/body_lab.apk"
          }
          EOJ
          cat dist/version.json
          git tag -f latest
          git push -f origin latest
          NOTES="版本 $VERSION（build $BUILD），來自 commit ${GITHUB_SHA::7}（$(date -u +'%Y-%m-%d %H:%M UTC')）。

          - **body_lab.apk**：Android，手機瀏覽器下載後開啟安裝；第一次要允許「安裝未知來源 App」。簽名固定，之後可直接覆蓋安裝升級；App 啟動時會自動提示新版本。
          - **body_lab-unsigned.ipa**：iOS，未簽名。Windows 用 Sideloadly 以自己的 Apple ID 重新簽名後裝進 iPhone；免費 Apple ID 7 天到期後重裝一次即可。"
          TITLE="最新版 $VERSION（$BUILD）— Android APK + iOS IPA"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "$TITLE" --notes "$NOTES"
          else
            gh release create latest --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload latest dist/body_lab.apk dist/body_lab-unsigned.ipa --clobber
          gh release upload latest dist/version.json --clobber
