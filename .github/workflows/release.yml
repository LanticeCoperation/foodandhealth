name: Release builds

# push 到 main：iOS（未簽名 .ipa）與 Android（正式簽名 APK）平行編譯，
# 兩邊都成功後一起放到固定的 Release「latest」，網址不變、直接下載。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  ios:
    name: iOS (.ipa, no codesign)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # 不簽名：Sideloadly 安裝時會用使用者自己的 Apple ID 重簽，HealthKit entitlements 會一併保留。
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned ipa
        run: |
          rm -rf ipa && mkdir -p ipa/Payload
          cp -R build/ios/iphoneos/Runner.app ipa/Payload/
          cd ipa && zip -qry body_lab-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: body_lab/ipa/body_lab-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android (.apk, release key)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: body_lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # 從 Secrets 還原簽名金鑰；每次簽名一致，手機才能直接覆蓋升級、資料不掉。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 secret，請先執行 upload-secrets.ps1"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOP
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          EOP
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/body_lab.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: body_lab/build/body_lab.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to Release "latest"
    needs: [ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          git tag -f latest
          git push -f origin latest
          NOTES="來自 commit ${GITHUB_SHA::7}（$(date -u +'%Y-%m-%d %H:%M UTC')）。

          - **body_lab.apk**：Android，手機瀏覽器下載後開啟安裝；第一次要允許「安裝未知來源 App」。簽名固定，之後可直接覆蓋安裝升級。
          - **body_lab-unsigned.ipa**：iOS，未簽名。Windows 用 Sideloadly 以自己的 Apple ID 重新簽名後裝進 iPhone；免費 Apple ID 7 天到期後重裝一次即可。"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "最新版（Android APK + iOS IPA）" --notes "$NOTES"
          else
            gh release create latest --title "最新版（Android APK + iOS IPA）" --notes "$NOTES"
          fi
          gh release upload latest dist/body_lab.apk dist/body_lab-unsigned.ipa --clobber
